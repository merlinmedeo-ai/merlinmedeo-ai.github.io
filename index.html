<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MerlinMedia KinoBD</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000;
            overflow-x: hidden;
        }

        #kinobd {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #error {
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
    </style>
</head>

<body>

<div id="kinobd"></div>
<div id="error" hidden></div>

<script>
    const params = new URLSearchParams(location.search);

    const kp = (params.get('kp') || '').trim();
    let imdb = (params.get('imdb') || '').trim();

    const player = document.getElementById('kinobd');
    const error = document.getElementById('error');

    let valid = false;

    // =========================
    // KINOPOISK
    // =========================

    if (/^\d+$/.test(kp)) {

        player.setAttribute('data-kinopoisk', kp);

        console.log(
            '[KinoBD] Kinopoisk:',
            kp
        );

        valid = true;
    }

    // =========================
    // IMDB
    // =========================

    else if (imdb) {

        // KinoBD в примере использует IMDb без "tt"
        // поэтому tt0499549 превращаем в 0499549
        imdb = imdb.replace(/^tt/i, '');

        if (/^\d+$/.test(imdb)) {

            player.setAttribute(
                'data-player',
                'videospider'
            );

            player.setAttribute(
                'data-imdb',
                imdb
            );

            console.log(
                '[KinoBD] IMDb:',
                imdb
            );

            valid = true;
        }
    }

    // =========================
    // ОШИБКА
    // =========================

    if (!valid) {

        player.remove();

        error.hidden = false;

        error.textContent =
            'Используйте ?kp=401177 или ?imdb=tt0499549';

    } else {

        // =========================
        // ЗАГРУЗКА KINOBD
        // =========================

        const script =
            document.createElement('script');

        script.src =
            'https://kinobd.net/js/player_.js';

        script.onload = () => {
            console.log(
                '[KinoBD] player_.js загружен'
            );
        };

        script.onerror = () => {

            console.error(
                '[KinoBD] Ошибка загрузки player_.js'
            );

            error.hidden = false;

            error.textContent =
                'Не удалось загрузить KinoBD.';
        };

        document.body.appendChild(script);
    }
</script>

</body>
</html>
