<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MerlinMedia KinoBD</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000;
            overflow-x: hidden;
        }

        #kinobd {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #error {
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
    </style>
</head>

<body>

<div id="kinobd"></div>
<div id="error" hidden></div>

<script>
    const params = new URLSearchParams(location.search);
    const kp = (params.get('kp') || '').trim();

    const player = document.getElementById('kinobd');
    const error = document.getElementById('error');

    if (!/^\d+$/.test(kp)) {
        player.remove();
        error.hidden = false;
        error.textContent = 'Укажите Kinopoisk ID: ?kp=401177';
    } else {
        // Официальный способ KinoBD:
        // <div id="kinobd" data-kinopoisk="401522"></div>
        player.setAttribute('data-kinopoisk', kp);

        const script = document.createElement('script');
        script.src = 'https://kinobd.net/js/player_.js';

        document.body.appendChild(script);
    }
</script>

</body>
</html>
