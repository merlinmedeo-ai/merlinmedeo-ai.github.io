<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MerlinMedia KinoBD</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #kinobd {
            width: 100%;
            height: 100%;
            min-height: 600px;
        }

        #error {
            display: none;
            padding: 30px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div id="kinobd"></div>
<div id="error"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const kp = params.get('kp');

    const player = document.getElementById('kinobd');
    const error = document.getElementById('error');

    if (!kp || !/^\d+$/.test(kp)) {
        player.style.display = 'none';
        error.style.display = 'block';
        error.textContent =
            'Укажи Kinopoisk ID: ?kp=401177';
    } else {
        player.setAttribute('data-kinopoisk', kp);

        const script = document.createElement('script');
        script.src = 'https://kinobd.net/js/player_.js';

        document.body.appendChild(script);
    }
</script>

</body>
</html>
